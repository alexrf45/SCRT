<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            padding: 2rem;
            min-height: 100vh;
        }
        h1 { color: #58a6ff; font-size: 1.4rem; margin-bottom: 0.2rem; }
        .subtitle { color: #6e7681; font-size: 0.8rem; margin-bottom: 2rem; }

        /* Auth */
        #auth-form { max-width: 380px; }
        #auth-form input {
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.5rem 0.75rem;
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            outline: none;
        }
        #auth-form input:focus { border-color: #58a6ff; }
        #auth-error { color: #f85149; font-size: 0.8rem; margin-top: 0.4rem; min-height: 1.1rem; }

        /* Buttons */
        button {
            background: #238636;
            border: 1px solid transparent;
            color: #fff;
            padding: 0.35rem 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.8rem;
        }
        button:hover { opacity: 0.85; }
        button.danger  { background: #b91c1c; }
        button.warn    { background: #92400e; }
        button.muted   { background: #21262d; border-color: #30363d; color: #c9d1d9; }
        button.shell   { background: #1f6feb; }

        /* Status bar */
        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            font-size: 0.78rem;
            color: #6e7681;
        }
        #status-msg { color: #3fb950; min-width: 12rem; }
        #status-msg.err { color: #f85149; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead th {
            text-align: left;
            padding: 0.4rem 0.75rem;
            border-bottom: 1px solid #21262d;
            color: #6e7681;
            font-weight: normal;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
        }
        tbody tr { border-bottom: 1px solid #161b22; }
        tbody tr:hover { background: #161b22; }
        td { padding: 0.55rem 0.75rem; vertical-align: middle; }
        .running { color: #3fb950; }
        .exited  { color: #f85149; }
        .other   { color: #d29922; }
        .actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .dim { color: #6e7681; }

        #main { display: none; }

        /* Terminal panel */
        #term-panel {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 55vh;
            background: #0d1117;
            border-top: 1px solid #30363d;
            flex-direction: column;
            z-index: 50;
        }
        #term-panel.open { display: flex; }
        #term-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.35rem 1rem;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
        }
        #term-title { font-size: 0.8rem; color: #58a6ff; }
        #term-status { font-size: 0.75rem; color: #6e7681; margin-left: 1rem; }
        #term-close {
            background: none;
            border: none;
            color: #6e7681;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 0.25rem;
            line-height: 1;
        }
        #term-close:hover { color: #c9d1d9; opacity: 1; }
        #term-body {
            flex: 1;
            overflow: hidden;
            padding: 4px;
            background: #0d1117;
        }
        /* xterm container fills term-body */
        #term-body .xterm { height: 100%; }
        #term-body .xterm-viewport { background: #0d1117 !important; }
    </style>
</head>
<body>

<h1>SCRT</h1>
<p class="subtitle">Security Research Container Toolkit</p>

<div id="auth-form">
    <input type="password" id="token-input" placeholder="Bearer token" autocomplete="off" />
    <button onclick="authenticate()">Connect</button>
    <p id="auth-error"></p>
</div>

<div id="main">
    <div id="status-bar">
        <span id="status-msg">Connected</span>
        <span>
            Refresh: 10s &nbsp;
            <button class="muted" onclick="loadContainers()">&#x21BA; Refresh</button>
            &nbsp;
            <button class="muted" onclick="logout()">Disconnect</button>
        </span>
    </div>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>State</th>
                <th>Status</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <tr><td colspan="5" class="dim" style="text-align:center;padding:1.5rem;">Loading...</td></tr>
        </tbody>
    </table>
</div>

<!-- Terminal panel (slides up from the bottom) -->
<div id="term-panel">
    <div id="term-header">
        <div style="display:flex;align-items:center;">
            <span id="term-title">Shell</span>
            <span id="term-status">connecting…</span>
        </div>
        <button id="term-close" onclick="closeShell()" title="Close terminal">&#x2715;</button>
    </div>
    <div id="term-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
    'use strict';

    let token = sessionStorage.getItem('scrt_token') || '';
    let timer = null;

    // Terminal state
    let term = null;
    let fitAddon = null;
    let termWs = null;
    let termResizeObserver = null;

    if (token) showDashboard();

    /* ── Auth ── */

    function authenticate() {
        token = document.getElementById('token-input').value.trim();
        if (!token) return;
        apiFetch('GET', '/api/v1/containers')
            .then(() => {
                sessionStorage.setItem('scrt_token', token);
                document.getElementById('auth-error').textContent = '';
                showDashboard();
            })
            .catch(e => {
                document.getElementById('auth-error').textContent = e.message || 'Connection failed';
                token = '';
            });
    }

    function showDashboard() {
        document.getElementById('auth-form').style.display = 'none';
        document.getElementById('main').style.display = 'block';
        loadContainers();
        timer = setInterval(loadContainers, 10000);
    }

    function logout() {
        clearInterval(timer);
        closeShell();
        token = '';
        sessionStorage.removeItem('scrt_token');
        document.getElementById('auth-form').style.display = 'block';
        document.getElementById('main').style.display = 'none';
        document.getElementById('token-input').value = '';
    }

    /* ── API ── */

    function apiFetch(method, path, body) {
        const opts = {
            method,
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        };
        if (body) opts.body = JSON.stringify(body);
        return fetch(path, opts).then(r => {
            if (r.status === 401) throw new Error('Invalid token');
            if (!r.ok) {
                return r.text().then(text => {
                    let msg;
                    try { msg = JSON.parse(text).error; } catch (_) { msg = r.statusText; }
                    throw new Error(msg);
                });
            }
            return r.status === 204 ? null : r.json();
        });
    }

    function setStatus(msg, isErr) {
        const el = document.getElementById('status-msg');
        el.textContent = msg;
        el.className = isErr ? 'err' : '';
        if (!isErr) setTimeout(() => { el.textContent = 'Connected'; el.className = ''; }, 4000);
    }

    /* ── Container table ── */

    function loadContainers() {
        apiFetch('GET', '/api/v1/containers')
            .then(renderTable)
            .catch(e => setStatus(e.message, true));
    }

    function renderTable(containers) {
        const tbody = document.getElementById('tbody');
        if (!containers || containers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="dim" style="text-align:center;padding:1.5rem;">No SCRT containers found</td></tr>';
            return;
        }
        tbody.innerHTML = containers.map(c => {
            const stateClass = c.State === 'running' ? 'running' : c.State === 'exited' ? 'exited' : 'other';
            const stopBtn = c.State === 'running'
                ? `<button class="warn" onclick="stopContainer('${esc(c.Name)}')">Stop</button>`
                : '';
            const shellBtn = c.State === 'running'
                ? `<button class="shell" onclick="openShell('${esc(c.Name)}')">Shell</button>`
                : '';
            return `<tr>
                <td><strong>${esc(c.Name)}</strong></td>
                <td class="${stateClass}">${esc(c.State)}</td>
                <td class="dim">${esc(c.Status)}</td>
                <td class="dim">${esc(c.Image)}</td>
                <td><div class="actions">
                    ${shellBtn}
                    ${stopBtn}
                    <button onclick="backupContainer('${esc(c.Name)}')">Backup</button>
                    <button class="danger" onclick="destroyContainer('${esc(c.Name)}')">Destroy</button>
                </div></td>
            </tr>`;
        }).join('');
    }

    function stopContainer(name) {
        apiFetch('POST', '/api/v1/containers/' + name + '/stop')
            .then(() => { setStatus('Stopped ' + name); loadContainers(); })
            .catch(e => setStatus('Stop failed: ' + e.message, true));
    }

    function destroyContainer(name) {
        if (!confirm('Destroy ' + name + ' and all project data? This cannot be undone.')) return;
        apiFetch('POST', '/api/v1/containers/' + name + '/destroy')
            .then(() => { setStatus('Destroyed ' + name); loadContainers(); })
            .catch(e => setStatus('Destroy failed: ' + e.message, true));
    }

    function backupContainer(name) {
        apiFetch('POST', '/api/v1/containers/' + name + '/backup')
            .then(d => setStatus('Backup saved: ' + d.file))
            .catch(e => setStatus('Backup failed: ' + e.message, true));
    }

    /* ── Web shell ── */

    function openShell(name) {
        // Tear down any existing session first.
        teardownTerminal();

        document.getElementById('term-title').textContent = 'Shell: ' + name;
        document.getElementById('term-status').textContent = 'connecting\u2026';
        document.getElementById('term-panel').classList.add('open');

        const body = document.getElementById('term-body');
        body.innerHTML = '';

        term = new Terminal({
            theme: {
                background:  '#0d1117',
                foreground:  '#c9d1d9',
                cursor:      '#58a6ff',
                black:       '#484f58',
                red:         '#ff7b72',
                green:       '#3fb950',
                yellow:      '#d29922',
                blue:        '#58a6ff',
                magenta:     '#bc8cff',
                cyan:        '#39c5cf',
                white:       '#b1bac4',
                brightBlack: '#6e7681',
            },
            fontFamily: "'Courier New', Courier, monospace",
            fontSize: 14,
            lineHeight: 1.2,
            cursorBlink: true,
            scrollback: 5000,
        });

        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(body);
        fitAddon.fit();

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const url = proto + '//' + location.host + '/ws/exec/' + encodeURIComponent(name)
                  + '?token=' + encodeURIComponent(token);
        termWs = new WebSocket(url);
        termWs.binaryType = 'arraybuffer';

        termWs.onopen = () => {
            document.getElementById('term-status').textContent = 'connected';
            sendResize();
            term.focus();
        };

        termWs.onmessage = e => {
            if (e.data instanceof ArrayBuffer) {
                term.write(new Uint8Array(e.data));
            }
        };

        termWs.onclose = () => {
            document.getElementById('term-status').textContent = 'disconnected';
            if (term) term.write('\r\n\x1b[2m[session closed]\x1b[0m\r\n');
        };

        termWs.onerror = () => {
            document.getElementById('term-status').textContent = 'error';
            if (term) term.write('\r\n\x1b[31m[connection error]\x1b[0m\r\n');
        };

        // Keyboard input → docker stdin
        term.onData(data => {
            if (termWs && termWs.readyState === WebSocket.OPEN) {
                const encoded = new TextEncoder().encode(data);
                termWs.send(encoded);
            }
        });

        // Auto-resize when the panel dimensions change
        termResizeObserver = new ResizeObserver(() => {
            if (fitAddon) {
                fitAddon.fit();
                sendResize();
            }
        });
        termResizeObserver.observe(body);
    }

    function sendResize() {
        if (!termWs || termWs.readyState !== WebSocket.OPEN || !term) return;
        termWs.send(JSON.stringify({ type: 'resize', rows: term.rows, cols: term.cols }));
    }

    function closeShell() {
        document.getElementById('term-panel').classList.remove('open');
        teardownTerminal();
    }

    function teardownTerminal() {
        if (termResizeObserver) { termResizeObserver.disconnect(); termResizeObserver = null; }
        if (termWs) { termWs.close(); termWs = null; }
        if (term) { term.dispose(); term = null; }
        fitAddon = null;
    }

    /* ── Utilities ── */

    function esc(s) {
        if (!s) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    document.getElementById('token-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') authenticate();
    });
</script>
</body>
</html>
