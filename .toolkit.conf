# toolkit configuration file
# Uncomment and modify variables as needed

#NAME='test'

#TARGET='fake-target'

#DOMAIN='osiris.local'

#IP='192.168.101.10'

#USER='billy'

# Docker image to use
#TOOL_TAG="latest"

# Shell to use inside container
#TOOL_SHELL="/bin/zsh"

