# SCRT bearer token secret.
#
# Do NOT commit a real token here. Inject the value via one of:
#   kubectl create secret generic scrt-token -n scrt --from-literal=token=<value>
#   External Secrets Operator / Vault / AWS Secrets Manager
#
apiVersion: v1
kind: Secret
metadata:
  name: scrt-token
  namespace: scrt
type: Opaque
stringData:
  token: ""   # set externally — never hardcode
