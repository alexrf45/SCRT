name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─── Quality gate ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scrt/go.mod
          cache-dependency-path: scrt/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  # ─── Go binary → GitHub Release ──────────────────────────────────────────────
  binary:
    name: Build Binary
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scrt/go.mod
          cache-dependency-path: scrt/go.sum

      - name: Build linux/amd64
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
              -o bin/scrt-linux-amd64 \
              ./cmd/scrt

      - name: Upload binary to release
        run: gh release upload ${{ github.ref_name }} bin/scrt-linux-amd64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Docker image → Docker Hub ───────────────────────────────────────────────
  docker:
    name: Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify Slack — starting
        uses: act10ns/slack@v2
        with:
          status: starting
          channel: '#docker-build'
          message: Starting SCRT release build ${{ github.ref_name }}...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: fonalex45/scrt
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Notify Slack — result
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          channel: '#prod'
          message: Release ${{ github.ref_name }} complete
        if: always()
